<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>린치트래커</title>
<style>html,body{margin:0;height:100%;background:#000;color:#8d929c;font:15px/1.6 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
#msg a{color:#4d84ff}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}</style></head>
<body><div id="msg">최신 린치트래커를 불러오는 중입니다.</div>
<script>
// archive 폴더의 YYYY-MM-DD.html 목록 찾기: GitHub API → 실패하면 최근 날짜를 직접 확인
window.ltFindDates = async function (base) {
  const re = /^(\d{4}-\d{2}-\d{2})\.html$/;
  try {
    const r = await fetch('https://api.github.com/repos/narllo2upside/narllo/contents/archive', { cache: 'no-store' });
    if (r.ok) {
      const list = (await r.json()).map((f) => (f.name.match(re) || [])[1]).filter(Boolean).sort().reverse();
      if (list.length) return list;
    }
  } catch (e) {}
  const out = [];
  const d = new Date();
  for (let i = 0; i < 45; i++) {
    const s = new Date(d.getTime() - i * 864e5).toISOString().slice(0, 10);
    try { const r = await fetch(base + s + '.html', { method: 'HEAD', cache: 'no-store' }); if (r.ok) out.push(s); } catch (e) {}
  }
  return out;
};
(async () => {
  const dates = await window.ltFindDates('archive/');
  const msg = document.getElementById('msg');
  if (!dates.length) { msg.innerHTML = '아직 올라온 기록이 없습니다. <a href="archive/">지난 기록</a>'; return; }
  const f = document.createElement('iframe');
  f.src = 'archive/' + dates[0] + '.html';
  f.title = '린치트래커 ' + dates[0];
  f.onload = () => { msg.remove(); document.title = '린치트래커 · ' + dates[0]; };
  document.body.append(f);
})();
</script></body></html>
